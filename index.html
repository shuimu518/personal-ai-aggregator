<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人AI聚合平台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      max-width: 760px;
      width: 92%;
      padding: 36px;
      background: #161b22;
      border-radius: 18px;
      border: 1px solid #30363d;
    }
    h1 {
      font-size: 26px;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #58a6ff, #f0883e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      color: #8b949e;
      font-size: 14px;
      margin-bottom: 28px;
    }
    .input-group {
      display: flex;
      gap: 12px;
      margin-bottom: 14px;
    }
    input[type="text"] {
      flex: 1;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid #30363d;
      background: #0d1117;
      color: #e6edf3;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus { border-color: #58a6ff; }
    button {
      padding: 14px 26px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #238636, #2ea043);
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #result-area {
      margin-top: 18px;
      padding: 18px;
      background: #0d1117;
      border-radius: 12px;
      border: 1px solid #30363d;
      min-height: 80px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 15px;
      line-height: 1.7;
      color: #e6edf3;
    }
    #status {
      margin-top: 10px;
      font-size: 14px;
      color: #8b949e;
    }
    .status-loading { color: #f0883e; }
    .status-success { color: #3fb950; }
    .status-error { color: #f85149; }
    .footer {
      margin-top: 22px;
      font-size: 12px;
      color: #484f58;
      text-align: center;
      border-top: 1px solid #21262d;
      padding-top: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>?? 个人AI聚合平台</h1>
    <p class="subtitle">输入你的问题，前端将尝试触发 GitHub Actions 工作流</p>
    <div class="input-group">
      <input type="text" id="prompt-input" placeholder="输入你的问题..." />
      <button id="send-btn">发送</button>
    </div>
    <div id="result-area">等待你的提问...</div>
    <div id="status"></div>
    <div class="footer">前端静态页示例 · 需要配置 Actions 与模型 Key</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
