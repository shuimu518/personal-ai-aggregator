<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人AI聚合平台</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #0b0f19, #111827);
      color: #e6edf3;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 36px 16px;
    }
    .container {
      max-width: 920px;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }
    @media (min-width: 760px) {
      .container { grid-template-columns: 320px 1fr; }
    }
    .card {
      background: #111827;
      border: 1px solid #30363d;
      border-radius: 18px;
      padding: 22px;
    }
    h1 {
      grid-column: 1 / -1;
      font-size: 26px;
      background: linear-gradient(135deg, #58a6ff, #f0883e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    label {
      display: block;
      font-size: 13px;
      color: #8b949e;
      margin-bottom: 6px;
    }
    select, textarea, input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid #30363d;
      background: #0b0f19;
      color: #e6edf3;
      font-size: 15px;
      outline: none;
      margin-bottom: 14px;
    }
    textarea { min-height: 130px; resize: vertical; }
    select:focus, textarea:focus, input:focus { border-color: #58a6ff; }
    button {
      width: 100%;
      padding: 13px 18px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #238636, #2ea043);
      color: white;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.88; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #result-area {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 15px;
      line-height: 1.7;
      color: #e6edf3;
      min-height: 90px;
    }
    #status {
      font-size: 14px;
      color: #8b949e;
      margin-top: 10px;
    }
    .status-loading { color: #f0883e; }
    .status-success { color: #3fb950; }
    .status-error { color: #f85149; }
    .meta {
      font-size: 12px;
      color: #8b949e;
      margin-top: 8px;
    }
    .footer {
      grid-column: 1 / -1;
      font-size: 12px;
      color: #484f58;
      text-align: center;
      padding-top: 6px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>个人AI聚合平台</h1>
    <form id="chat-form" class="card" onsubmit="event.preventDefault()">
      <label for="provider-select">模型提供商</label>
      <select id="provider-select" name="provider">
        <option value="" disabled selected>选择模型提供商</option>
      </select>

      <label for="model-select">模型</label>
      <select id="model-select" name="model">
        <option value="" disabled selected>请先选择模型提供商</option>
      </select>

      <label for="base-url">Base URL</label>
      <input id="base-url" type="text" value="https://open.bigmodel.cn/api/anthropic" />

      <label for="prompt-input">输入你的问题</label>
      <textarea id="prompt-input" placeholder="输入你的问题..."></textarea>

      <button id="send-btn" type="submit">发送</button>
      <div id="status"></div>
      <div class="meta">当前为前端演示模式，选完模型后点发送即可看到确认信息。</div>
    </form>
    <div class="card">
      <div id="result-area">等待你的提问...</div>
      <div class="footer">聚合平台测试版</div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
